minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true
cooldown_days = 0

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "ef6cf06c079dd6b299dfc720b0f14400c9d168e1" # frozen: v0.17.5
hooks = [
  # Discover scripts/pyproject.toml per file so scripts/ stays the project root.
  { id = "ruff-check", files = "^scripts/" },
  { id = "ruff-format", files = "^scripts/", args = ["--check"] },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "539ea2e1c5a0eb8adeb5fe0b1e2eb66fa5827042" # frozen: v0.3.5
hooks = [{ id = "rumdl-check" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "276087d9a4f06398b3e04825487805e2d7375888" # frozen: v1.52.2
hooks = [{ id = "typos" }]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8" # frozen: v4.5.0
hooks = [
  # No Node or project dependencies; strict mode also checks merge and fixup messages.
  { id = "conventional-pre-commit", stages = [
    "commit-msg",
  ], args = [
    "--strict",
    "--verbose",
  ] },
]

[[repos]]
repo = "local"

# Managed environments install only these tools, not the app's dependencies.
# Keep additional_dependencies aligned with pnpm-lock.yaml.
[[repos.hooks]]
id = "ls-lint"
name = "file naming (pinned ls-lint)"
language = "node"
language_version = ">=22"
additional_dependencies = ["@ls-lint/ls-lint@2.3.2"]
entry = "node --run file-naming"
pass_filenames = false
always_run = true

# Submodules are not allowed.
[[repos.hooks]]
id = "forbid-submodules"
name = "forbid submodules"
language = "fail"
entry = "submodules are not allowed in this repository:"
types = ["directory"]

# Type-aware linting resolves the app's own dependencies, so this hook runs
# against the locked node_modules from `make install`.
[[repos.hooks]]
id = "vite-plus"
name = "Vite+ format, lint and types (Oxfmt + Oxlint)"
language = "system"
entry = "make lint"
files = "\\.([cm]?[jt]sx?|json|css|ya?ml|toml)$"
pass_filenames = false

[[repos.hooks]]
id = "typecheck"
name = "TypeScript and Python type checks"
language = "system"
entry = "make typecheck qa-python"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "tests"
name = "Unit tests (Vitest and pytest)"
language = "system"
entry = "make test"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  # pnpm writes a multi-document YAML lockfile.
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-toml" },
  # tsconfig files are JSONC.
  { id = "check-json", exclude = "^tsconfig(\\.\\w+)?\\.json$" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-illegal-windows-names" },
  { id = "mixed-line-ending" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
  { id = "no-commit-to-branch", args = ["--branch=main"] },
]

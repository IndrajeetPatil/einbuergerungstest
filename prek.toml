minimum_prek_version = "0.5.10"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true
cooldown_days = 0

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "c0f278f1254ccc8fb09676bcdb8d847e7db493e5" # frozen: v0.17.4
hooks = [
  # Discover scripts/pyproject.toml per file so scripts/ stays the project root.
  { id = "ruff-check", files = "^scripts/" },
  { id = "ruff-format", files = "^scripts/", args = ["--check"] },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "b0cff962ee693b9e612c097d22e71e0cba127447" # frozen: v0.3.2
hooks = [{ id = "rumdl-check" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85" # frozen: v1.52.0
hooks = [{ id = "typos" }]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8" # frozen: v4.5.0
hooks = [
  # No Node or project dependencies; strict mode also checks merge and fixup messages.
  { id = "conventional-pre-commit", stages = [
    "commit-msg",
  ], args = [
    "--strict",
    "--verbose",
  ] },
]

[[repos]]
repo = "local"

# Managed environments install only these tools, not the app's dependencies.
# Keep additional_dependencies aligned with pnpm-lock.yaml.
[[repos.hooks]]
id = "ls-lint"
name = "file naming (pinned ls-lint)"
language = "node"
language_version = ">=22"
additional_dependencies = ["@ls-lint/ls-lint@2.3.2"]
entry = "node --run file-naming"
pass_filenames = false
always_run = true

# Type-aware linting resolves the app's own dependencies, so this hook runs
# against the locked node_modules from `make install`.
[[repos.hooks]]
id = "vite-plus"
name = "Vite+ format, lint and types (Oxfmt + Oxlint)"
language = "system"
entry = "make lint"
files = "\\.([cm]?[jt]sx?|json|css|ya?ml|toml)$"
pass_filenames = false

[[repos.hooks]]
id = "typecheck"
name = "TypeScript and Python type checks"
language = "system"
entry = "make typecheck qa-python"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "tests"
name = "Unit tests (Vitest and pytest)"
language = "system"
entry = "make test"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  # pnpm writes a multi-document YAML lockfile.
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-toml" },
  # tsconfig files are JSONC.
  { id = "check-json", exclude = "^tsconfig(\\.\\w+)?\\.json$" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
]

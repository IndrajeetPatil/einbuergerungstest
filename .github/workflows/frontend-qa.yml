name: Frontend QA

# Merge gate for pull requests into the protected `main` branch. Runs on pull
# requests only; direct pushes to `main` are validated locally with `make ci`.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-qa:
    uses: IndrajeetPatil/workflows/.github/workflows/frontend-qa.yaml@main

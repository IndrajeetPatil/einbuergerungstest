name: QA

# Merge gate for pull requests into the protected `main` branch. Runs on pull
# requests only; direct pushes to `main` are validated locally with `make ci`.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Explicit bash opts into `-o pipefail`.
defaults:
  run:
    shell: bash

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_COLOR: always
  UV_NO_PROGRESS: "1"

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node from .node-version, pnpm from devEngines, Vite+ from the lockfile.
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache: true
          cache-toolchain: true
          run-install: false

      # Ruff, ty, pyrefly and rumdl run through uv.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: make install

      # The same gates as `make qa`, with separately readable step logs.
      - name: File naming
        run: make file-naming

      - name: Format and lint (Oxfmt, Oxlint)
        run: make lint

      - name: Types (TypeScript 7)
        run: make typecheck

      - name: Python lint and types (Ruff, ty, pyrefly)
        run: make qa-python

      - name: Markdown lint (rumdl)
        run: make lint-markdown

      - name: Unit tests, coverage, dead code and complexity (Vitest, fallow)
        run: make fallow

      - name: CSS quality
        run: make css-quality

      - name: Production build
        run: make build

name: Scripts QA

# Python lint, type checks, and pytest suite of scripts/, on pull requests only.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: scripts-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_COLOR: always
  UV_NO_PROGRESS: "1"

jobs:
  scripts-qa:
    name: Scripts QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Python lint, format, and types (Ruff, ty, pyrefly)
        run: make qa-python

      - name: Python test suite
        run: make test-scripts

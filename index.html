<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <meta
      name="theme-color"
      content="#faf8f4"
    />
    <meta
      name="description"
      content="Bilingual (German/English) practice for the Einbürgerungstest „Leben in Deutschland“."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <title>Leben in Deutschland · Einbürgerungstest trainer</title>
    <script>
      // Dark mode before first paint, by the rule in src/lib/theme.ts: the
      // stored choice, else the system setting.
      const theme = localStorage.getItem("lid.theme");
      document.documentElement.classList.toggle(
        "dark",
        theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches),
      );
    </script>
    <!-- Google Analytics, as on every page of www.indrapatil.com (see its
         privacy notice). Local runs and tests on localhost load nothing. -->
    <script>
      (() => {
        const { hostname } = globalThis.location;
        if (hostname === "localhost" || hostname === "127.0.0.1") {
          return;
        }
        const script = document.createElement("script");
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-3BQ49J7KYH";
        script.async = true;
        document.head.append(script);

        // Gtag.js only processes `arguments` objects, never plain arrays.
        function gtag() {
          globalThis.dataLayer?.push(arguments);
        }
        globalThis.dataLayer ??= [];
        globalThis.gtag = gtag;
        gtag("js", new Date());
        // The site is served over HTTPS only, so scope the _ga cookies to
        // secure transport and same-site requests.
        gtag("config", "G-3BQ49J7KYH", { cookie_flags: "SameSite=Lax;Secure" });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <meta
      name="theme-color"
      content="#faf8f4"
    />
    <meta
      name="description"
      content="Bilingual (German/English) practice for the Einbürgerungstest „Leben in Deutschland“."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <title>Leben in Deutschland · Einbürgerungstest trainer</title>
    <script>
      // Dark mode before first paint, by the rule in src/lib/theme.ts: the
      // stored choice, else the system setting.
      const theme = localStorage.getItem("lid.theme");
      document.documentElement.classList.toggle(
        "dark",
        theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches),
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>

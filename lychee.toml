# lychee link checker configuration. Run: make link-check

exclude_path = [
  "node_modules",
  "dist",
  ".git",
  "coverage",
  "scripts/.venv",
  "src/data",
  # Vite resolves its root-relative asset links at build time.
  "index.html",
]

exclude = [
  # Local dev and preview servers.
  "^http://localhost",
  "^http://127\\.0\\.0\\.1",
  # Private repository links resolve only for signed-in collaborators.
  "^https://github\\.com/IndrajeetPatil/einbuergerungstest",
  "^https://github\\.com/IndrajeetPatil/indrajeetpatil\\.github\\.io",
]

# GitHub returns 429 without a token; lychee reads GITHUB_TOKEN when set.
max_retries = 3
accept = ["200..=299", "429"]
